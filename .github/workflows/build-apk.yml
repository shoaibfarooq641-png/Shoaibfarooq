name: Build Shoaib Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Public HTTPS URL where Shoaib is deployed'
        required: true
        default: 'https://ais-pre-wafv74ztnlerpzyqg7nlwy-972874695443.asia-southeast1.run.app'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap SDK paths
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Generate Android signing keystore
        run: |
          keytool -genkeypair \
            -keystore ./android.keystore \
            -alias shoaib \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass shoaib-keystore-pass \
            -keypass shoaib-keystore-pass \
            -dname "CN=Shoaib, OU=Mobile, O=Shoaib, L=City, S=State, C=US"
          keytool -list -v -keystore ./android.keystore -alias shoaib -storepass shoaib-keystore-pass | grep "SHA256:"

      - name: Generate Android project and build APK & AAB
        env:
          APP_URL: ${{ inputs.app_url || 'https://ais-pre-wafv74ztnlerpzyqg7nlwy-972874695443.asia-southeast1.run.app' }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: shoaib-keystore-pass
          BUBBLEWRAP_KEY_PASSWORD: shoaib-keystore-pass
        run: |
          node -e '
            require("fs").writeFileSync("public/manifest.webmanifest", JSON.stringify({
              id: "/",
              name: "Shoaib - Accurate AI Assistant",
              short_name: "Shoaib",
              description: "Fast, search-grounded conversational AI assistant for accurate answers about anything and anyone.",
              theme_color: "#0d9488",
              background_color: "#ffffff",
              display: "standalone",
              orientation: "portrait-primary",
              start_url: "/",
              scope: "/",
              icons: [
                { src: "/pwa-192x192.png", sizes: "192x192", type: "image/png", purpose: "any" },
                { src: "/pwa-512x512.png", sizes: "512x512", type: "image/png", purpose: "any" },
                { src: "/pwa-maskable-512x512.png", sizes: "512x512", type: "image/png", purpose: "maskable" }
              ]
            }, null, 2));
          '

          python3 -m http.server 8787 --directory public &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true; rm -f public/manifest.webmanifest" EXIT
          sleep 1

          node -e '
            const fs = require("fs");
            const appUrl = process.env.APP_URL.replace(/\/+$/, "");
            const parsed = new URL(appUrl);
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            manifest.host = parsed.host;
            manifest.iconUrl = "http://127.0.0.1:8787/pwa-512x512.png";
            manifest.maskableIconUrl = "http://127.0.0.1:8787/pwa-maskable-512x512.png";
            manifest.webManifestUrl = "http://127.0.0.1:8787/manifest.webmanifest";
            manifest.fullScopeUrl = appUrl + "/";
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
          '

          bubblewrap update --skipVersionUpgrade

          node -e '
            const fs = require("fs");
            const appUrl = process.env.APP_URL.replace(/\/+$/, "");
            const gradlePath = "app/build.gradle";
            if (fs.existsSync(gradlePath)) {
              const gradle = fs.readFileSync(gradlePath, "utf8");
              fs.writeFileSync(
                gradlePath,
                gradle.replace(/http:\/\/127\.0\.0\.1:8787\/manifest\.webmanifest/g, appUrl + "/manifest.webmanifest")
              );
            }
          '

          bubblewrap build --skipPwaValidation

      - name: Upload APK and Play Store AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shoaib-android-release
          path: |
            app-release-signed.apk
            app-release-bundle.aab
