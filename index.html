      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('shoaib_theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-900 dark:bg-[#0B0F14] dark:text-slate-100 antialiased selection:bg-teal-500/20 selection:text-teal-900 dark:selection:text-teal-200">

  </body>
